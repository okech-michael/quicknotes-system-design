<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Notes, connected to the web.</p>
  </header>
  <main>
    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="notes-list" aria-label="Notes from the server"></ul>
    </section>
    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form" novalidate>
        <div class="form-field">
          <label for="title-input">Title</label>
          <input id="title-input" name="title" type="text" maxlength="100" required>
        </div>
        <div class="form-field">
          <label for="body-input">Note</label>
          <textarea id="body-input" name="body" rows="4"></textarea>
        </div>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>
  </main>
  <footer>
    <p>QuickNotes API Client</p>
  </footer>
</body>
</html>
